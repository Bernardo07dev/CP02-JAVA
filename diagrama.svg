<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 600" width="200%" height="200%">
    <!-- Definições de setas para UML -->
    <defs>
        <!-- Seta de Herança (extends) -->
        <marker id="inheritance" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" orient="auto">
            <polygon points="0,0 14,7 0,14" fill="white" stroke="#333" stroke-width="1.5" />
        </marker>
        <!-- Seta de Associação (usa) -->
        <marker id="association" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto">
            <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.5" />
        </marker>
    </defs>

    <style>
        .box { fill: #fdfdfd; stroke: #333; stroke-width: 1.5; }
        .box-header { fill: #eaeaea; }
        .title { font-family: monospace; font-weight: bold; font-size: 14px; text-anchor: middle; }
        .stereo { font-family: monospace; font-size: 12px; font-style: italic; text-anchor: middle; }
        .text { font-family: monospace; font-size: 12px; }
        .line { stroke: #333; stroke-width: 1.5; }
        .connection { stroke: #333; stroke-width: 1.5; fill: none; }
        .dashed { stroke-dasharray: 6,4; }
    </style>

    <!-- Interface Entregavel -->
    <g transform="translate(100, 30)">
        <rect class="box" width="220" height="80" rx="3" ry="3"/>
        <rect class="box-header" width="220" height="45" rx="3" ry="3"/>
        <text class="stereo" x="110" y="20">&lt;&lt;interface&gt;&gt;</text>
        <text class="title" x="110" y="38">Entregavel</text>
        <line class="line" x1="0" y1="45" x2="220" y2="45"/>
        <text class="text" x="10" y="65">+ realizarEntrega()</text>
    </g>

    <!-- Interface IPedidos -->
    <g transform="translate(500, 30)">
        <rect class="box" width="220" height="80" rx="3" ry="3"/>
        <rect class="box-header" width="220" height="45" rx="3" ry="3"/>
        <text class="stereo" x="110" y="20">&lt;&lt;interface&gt;&gt;</text>
        <text class="title" x="110" y="38">IPedidos</text>
        <line class="line" x1="0" y1="45" x2="220" y2="45"/>
        <text class="text" x="10" y="65">+ obterStatusRastreio()</text>
    </g>

    <!-- Classe Abstrata Entregador -->
    <g transform="translate(100, 180)">
        <rect class="box" width="220" height="100" rx="3" ry="3"/>
        <rect class="box-header" width="220" height="45" rx="3" ry="3"/>
        <text class="stereo" x="110" y="20">&lt;&lt;abstract&gt;&gt;</text>
        <text class="title" x="110" y="38">Entregador</text>
        <line class="line" x1="0" y1="45" x2="220" y2="45"/>
        <text class="text" x="10" y="65">- nome: String</text>
        <text class="text" x="10" y="85">- veiculo: String</text>
    </g>

    <!-- Classe Abstrata Pedidos -->
    <g transform="translate(500, 180)">
        <rect class="box" width="220" height="110" rx="3" ry="3"/>
        <rect class="box-header" width="220" height="45" rx="3" ry="3"/>
        <text class="stereo" x="110" y="20">&lt;&lt;abstract&gt;&gt;</text>
        <text class="title" x="110" y="38">Pedidos</text>
        <line class="line" x1="0" y1="45" x2="220" y2="45"/>
        <text class="text" x="10" y="65">- id: int</text>
        <text class="text" x="10" y="85">- destino: String</text>
        <text class="text" x="10" y="105">- status: String</text>
    </g>

    <!-- Classe Motoboy -->
    <g transform="translate(20, 360)">
        <rect class="box" width="180" height="80" rx="3" ry="3"/>
        <rect class="box-header" width="180" height="30" rx="3" ry="3"/>
        <text class="title" x="90" y="20">Motoboy</text>
        <line class="line" x1="0" y1="30" x2="180" y2="30"/>
        <text class="text" x="10" y="50">- placaMoto: String</text>
        <text class="text" x="10" y="70">+ calcularFrete()</text>
    </g>

    <!-- Classe CarroEntregador -->
    <g transform="translate(240, 360)">
        <rect class="box" width="180" height="80" rx="3" ry="3"/>
        <rect class="box-header" width="180" height="30" rx="3" ry="3"/>
        <text class="title" x="90" y="20">CarroEntregador</text>
        <line class="line" x1="0" y1="30" x2="180" y2="30"/>
        <text class="text" x="10" y="50">+ calcularFrete()</text>
        <text class="text" x="10" y="70">+ realizarEntrega()</text>
    </g>

    <!-- Classe PedidoEntrega -->
    <g transform="translate(500, 360)">
        <rect class="box" width="220" height="80" rx="3" ry="3"/>
        <rect class="box-header" width="220" height="30" rx="3" ry="3"/>
        <text class="title" x="110" y="20">PedidoEntrega</text>
        <line class="line" x1="0" y1="30" x2="220" y2="30"/>
        <text class="text" x="10" y="50">- entregadorResponsavel</text>
        <text class="text" x="10" y="70">+ atribuirEntregador()</text>
    </g>

    <!-- === Conexões UML === -->
    <!-- Entregador implements Entregavel -->
    <line class="connection dashed" x1="210" y1="180" x2="210" y2="124" marker-end="url(#inheritance)"/>
    
    <!-- Pedidos implements IPedidos -->
    <line class="connection dashed" x1="610" y1="180" x2="610" y2="124" marker-end="url(#inheritance)"/>
    
    <!-- Motoboy extends Entregador -->
    <path class="connection" d="M 110 360 L 110 320 L 170 320 L 170 294" marker-end="url(#inheritance)"/>
    
    <!-- CarroEntregador extends Entregador -->
    <path class="connection" d="M 330 360 L 330 320 L 250 320 L 250 294" marker-end="url(#inheritance)"/>
    
    <!-- PedidoEntrega extends Pedidos -->
    <line class="connection" x1="610" y1="360" x2="610" y2="304" marker-end="url(#inheritance)"/>
    
    <!-- PedidoEntrega usa (Associação) Entregador -->
    <path class="connection dashed" d="M 500 400 L 460 400 L 460 250 L 320 250" marker-end="url(#association)"/>
    <text class="stereo" x="425" y="325">usa</text>

</svg>
